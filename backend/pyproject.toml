[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hadrami-api"
version = "2.0.0"
description = "Hadrami dialect NLP API (FastAPI on Vercel)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.18",
  "requests>=2.28.0",
  "google-generativeai>=0.8.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.23.0",
  "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

# Vercel discovers the ASGI app via this entry (see Vercel FastAPI docs).
[project.scripts]
app = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
